name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest -q
      - name: Avaliação completa (baixa os dados públicos da Olist)
        run: |
          python -m copiloto.data
          python evals/run_evals.py --markdown >> "$GITHUB_STEP_SUMMARY"
