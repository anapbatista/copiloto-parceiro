[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copiloto-parceiro"
version = "0.1.0"
description = "Copiloto de IA para parceiros de marketplace: classifica avaliações reais em PT-BR, encontra os motivos das reclamações e gera um plano de ação verificado contra os dados."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ana Paula de Abreu Batista" }]
dependencies = ["pandas>=2", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
mcp = ["mcp>=2"]
train = ["torch", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "sentencepiece", "huggingface_hub"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["copiloto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
